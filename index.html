/**
 * グループ通話を開始する
 */
async function startGroupCall(chatId) {
  if (!currentUser) return showStatus('ログインが必要です', 'error');
  if (groupCallState.active) return showStatus('すでに通話中です', 'warn');

  const chat = chatsCache[chatId];
  if (!chat) return showStatus('チャットが見つかりません', 'error');
  if (!chat.members || Object.keys(chat.members).length < 2) {
    return showStatus('グループ通話には2人以上必要です', 'warn');
  }

  try {
    // マイク取得
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false
    });
    groupCallState.localStream = stream;
    groupCallState.micEnabled = true;
    groupCallState.chatId = chatId;
    groupCallState.active = true;

    const sessionRef = push(ref(db, `groupCalls/${chatId}`));
    groupCallState.sessionId = sessionRef.key;
    const sessionId = sessionRef.key;

    // セッションメタデータ + 自分の参加者エントリを同時に書き込み
    const sessionData = {
      createdAt: Date.now(),
      createdBy: currentUser.uid,
      active: true,
      callerUid: currentUser.uid,
      callerName: myProfile.nickname || currentUser.email || 'ユーザー'
    };
    await set(sessionRef, sessionData);
    await set(ref(db, `groupCalls/${chatId}/${sessionId}/participants/${currentUser.uid}`), {
      uid: currentUser.uid,
      joinedAt: Date.now(),
      micEnabled: true,
      nickname: myProfile.nickname || '',
      avatar: myProfile.avatar || DEFAULT_AVATAR
    });

    // 切断時に自動的に参加者エントリを削除
    const myParticipantRef = ref(db, `groupCalls/${chatId}/${sessionId}/participants/${currentUser.uid}`);
    onDisconnect(myParticipantRef).remove();

    // UI 更新
    showCallPanel();
    updateCallPanelForGroup(chatId, sessionId, {});
    setupGroupCallListeners(chatId, sessionId);

    showStatus('グループ通話を開始しました', 'success');
  } catch (e) {
    console.error('[groupCall] start error:', e);
    showStatus('通話開始に失敗: ' + (e.message || e), 'error');
    cleanupGroupCall();
  }
}

/**

  const participantsRef = ref(db, `groupCalls/${chatId}/${sessionId}/participants`);
  const unsubParticipants = onValue(participantsRef, (snap) => {

    handleParticipantsUpdate(chatId, sessionId, participants);
  }, (err) => {
    console.error('[groupCall] participants listen error:', err);
    showStatus('参加者情報の取得に失敗しました', 'error');
  });
  groupCallState.participantsListener = unsubParticipants;

  // 自分宛てのシグナルの監視
  const signalsRef = ref(db, `groupCalls/${chatId}/${sessionId}/signals/${currentUser.uid}`);
  const unsubSignals = onValue(signalsRef, (snap) => {
    const signals = snap.val() || {};
    Object.entries(signals).forEach(([sigId, sig]) => {
      handleGroupCallSignal(chatId, sessionId, sig, sigId);
    });

    console.error('[groupCall] signals listen error:', err);
  });
  groupCallState.signalsListener = unsubSignals;
}

function cleanupGroupCallListeners() {

}

/**
 * 参加者リスト更新時の処理
 */
async function handleParticipantsUpdate(chatId, sessionId, participants) {
  const myUid = currentUser.uid;
  const participantUids = Object.keys(participants).filter(uid => uid !== myUid);

  // 新規参加者に対して Offer を送る（自分が既存メンバー＝先に参加している場合）
  // シンプルに「自分のuid < 相手のuid」の場合のみOfferを送る（グレア防止）
  for (const targetUid of participantUids) {
    if (!groupCallState.peers[targetUid]) {
      // 自分が既に参加していて、相手が後から来た場合はOfferを送る
      const targetJoinedAt = participants[targetUid]?.joinedAt || 0;
      const myJoinedAt = participants[myUid]?.joinedAt || 0;
      if (myJoinedAt < targetJoinedAt) {
        await createPeerConnection(targetUid, true);
      } else {
        // 相手のOfferを待つ（受動的にピアコネクション作成）
        await createPeerConnection(targetUid, false);
      }
    }
  }

  // 退出した参加者のピアを閉じる
  Object.keys(groupCallState.peers).forEach(uid => {
    if (!participants[uid]) {
      closePeer(uid);
    }
  });

  updateCallPanelForGroup(chatId, sessionId, participants);
}

/**
 * ピアコネクションを作成
 * @param {string} targetUid
 * @param {boolean} isInitiator - true なら Offer を送る
 */
async function createPeerConnection(targetUid, isInitiator) {
  if (groupCallState.peers[targetUid]) return groupCallState.peers[targetUid];

  const pc = new RTCPeerConnection(ICE_SERVERS);
  groupCallState.peers[targetUid] = pc;
  groupCallState.connectionStates[targetUid] = 'new';
  groupCallState.pendingCandidates[targetUid] = groupCallState.pendingCandidates[targetUid] || [];

  // ローカル音声を追加
  if (groupCallState.localStream) {
    groupCallState.localStream.getTracks().forEach(track => {
      pc.addTrack(track, groupCallState.localStream);
    });
  }

  // ICE candidate 送信
  pc.onicecandidate = (event) => {
    if (event.candidate) {
      const sigRef = push(ref(db, `groupCalls/${groupCallState.chatId}/${groupCallState.sessionId}/signals/${targetUid}`));
      set(sigRef, {
        type: 'ice',
        from: currentUser.uid,
        candidate: event.candidate.toJSON(),
        ts: Date.now()
      }).catch(e => console.warn('[groupCall] send ice error:', e));
    }
  };

  // リモートトラック受信
  pc.ontrack = (event) => {
    const remoteStream = event.streams[0];
    attachRemoteAudio(targetUid, remoteStream);
  };

  // 接続状態監視
  pc.onconnectionstatechange = () => {
    groupCallState.connectionStates[targetUid] = pc.connectionState;
    updateMemberConnectionState(targetUid, pc.connectionState);
    if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
      console.warn('[groupCall] peer connection failed/closed:', targetUid);
    }
  };

  if (isInitiator) {
    try {
      groupCallState.makingOffer[targetUid] = true;
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      const sigRef = push(ref(db, `groupCalls/${groupCallState.chatId}/${groupCallState.sessionId}/signals/${targetUid}`));
      await set(sigRef, {
        type: 'offer',
        from: currentUser.uid,
        sdp: pc.localDescription.toJSON(),
        ts: Date.now()
      });
    } catch (e) {
      console.error('[groupCall] createOffer error:', e);
    } finally {
      groupCallState.makingOffer[targetUid] = false;
    }
  }

  return pc;
}

/**
 * グループ通話シグナル処理
 */
async function handleGroupCallSignal(chatId, sessionId, sig, sigId) {
  if (!sig || !sig.type) return;
  const fromUid = sig.from;
  if (!fromUid || fromUid === currentUser.uid) return;

  // 処理済みシグナルは削除（Firebase上）
  const sigRef = ref(db, `groupCalls/${chatId}/${sessionId}/signals/${currentUser.uid}/${sigId}`);

  try {
    if (sig.type === 'offer') {
      if (!sig.sdp) throw new Error('offer missing sdp');
      let pc = groupCallState.peers[fromUid];
      if (!pc) {
        pc = await createPeerConnection(fromUid, false);
      }
      await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
      // 保留中の ICE を追加
      await flushPendingCandidates(fromUid);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      const answerRef = push(ref(db, `groupCalls/${chatId}/${sessionId}/signals/${fromUid}`));
      await set(answerRef, {
        type: 'answer',
        from: currentUser.uid,
        sdp: pc.localDescription.toJSON(),
        ts: Date.now()
      });
      await remove(sigRef);
    } else if (sig.type === 'answer') {
      if (!sig.sdp) throw new Error('answer missing sdp');
      const pc = groupCallState.peers[fromUid];
      if (!pc) return;
      groupCallState.isSettingRemoteAnswer[fromUid] = true;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
        await flushPendingCandidates(fromUid);
      } finally {
        groupCallState.isSettingRemoteAnswer[fromUid] = false;
      }
      await remove(sigRef);
    } else if (sig.type === 'ice') {
      if (!sig.candidate) throw new Error('ice missing candidate');
      const pc = groupCallState.peers[fromUid];
      if (!pc) {
        // ピアがまだない → 保留
        if (!groupCallState.pendingCandidates[fromUid]) {
          groupCallState.pendingCandidates[fromUid] = [];
        }
        groupCallState.pendingCandidates[fromUid].push(sig.candidate);
        await remove(sigRef);
        return;
      }
      if (pc.remoteDescription && pc.remoteDescription.type) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(sig.candidate));
        } catch (e) {
          console.warn('[groupCall] addIceCandidate error:', e);
        }
      } else {
        if (!groupCallState.pendingCandidates[fromUid]) {
          groupCallState.pendingCandidates[fromUid] = [];
        }
        groupCallState.pendingCandidates[fromUid].push(sig.candidate);
      }
      await remove(sigRef);
    }
  } catch (e) {
    console.error('[groupCall] signal handling error:', e, sig);
    // エラーでも通話全体は止めない
  }
}

async function flushPendingCandidates(targetUid) {
  const pc = groupCallState.peers[targetUid];
  const pending = groupCallState.pendingCandidates[targetUid] || [];
  groupCallState.pendingCandidates[targetUid] = [];
  if (!pc || !pc.remoteDescription) return;
  for (const cand of pending) {
    try {
      await pc.addIceCandidate(new RTCIceCandidate(cand));
    } catch (e) {
      console.warn('[groupCall] flush candidate error:', e);
    }
  }
}

/**
 * リモート音声を再生
 */
function attachRemoteAudio(targetUid, stream) {
  const container = document.getElementById('remoteAudioContainer');
  const audioId = `remoteAudio_${targetUid}`;
  let audio = document.getElementById(audioId);
  if (!audio) {
    audio = document.createElement('audio');
    audio.id = audioId;
    audio.autoplay = true;
    audio.playsInline = true;
    container.appendChild(audio);
  }
  audio.srcObject = stream;
  audio.play().catch(e => console.warn('[groupCall] audio play error:', e));
}

/**
 * ピアを閉じる
 */
function closePeer(targetUid) {
  const pc = groupCallState.peers[targetUid];
  if (pc) {
    try { pc.close(); } catch (e) {}
  }
  delete groupCallState.peers[targetUid];
  delete groupCallState.connectionStates[targetUid];
  delete groupCallState.pendingCandidates[targetUid];

  const audio = document.getElementById(`remoteAudio_${targetUid}`);
  if (audio) audio.remove();
}

/**
 * グループ通話を終了
 */
async function leaveGroupCall() {
  if (!groupCallState.active) return;
  const chatId = groupCallState.chatId;
  const sessionId = groupCallState.sessionId;

  try {
    if (chatId && sessionId && currentUser) {
      await remove(ref(db, `groupCalls/${chatId}/${sessionId}/participants/${currentUser.uid}`));
    }
  } catch (e) {
    console.warn('[groupCall] leave remove error:', e);
  }

  cleanupGroupCall();
  showStatus('グループ通話から退出しました', 'info');
}

function cleanupGroupCall() {
  cleanupGroupCallListeners();

  // 全ピアを閉じる
  Object.keys(groupCallState.peers).forEach(uid => closePeer(uid));

  // ローカル音声を停止
  if (groupCallState.localStream) {
    groupCallState.localStream.getTracks().forEach(track => {
      try { track.stop(); } catch (e) {}
    });
    groupCallState.localStream = null;
  }

  // リモート音声を全削除
  const container = document.getElementById('remoteAudioContainer');
  if (container) container.innerHTML = '';

  groupCallState.active = false;
  groupCallState.chatId = null;
  groupCallState.sessionId = null;
  groupCallState.micEnabled = true;
  groupCallState.peers = {};
  groupCallState.pendingCandidates = {};
  groupCallState.connectionStates = {};

  hideCallPanel();
}

function updateCallPanelForGroup(chatId, sessionId, participants) {

}

function updateMemberConnectionState(targetUid, state) {
  const chip = document.querySelector(`.cp-member-chip[data-uid="${targetUid}"]`);
  if (!chip) return;
  chip.classList.toggle('connecting', state !== 'connected');
  const small = chip.querySelector('small');
  if (small) {
    small.textContent = state === 'connected' ? '接続済み' : (state === 'failed' ? '失敗' : '接続中');
  }
}

/**
 * バナー表示（グループ通話中インジケータ）
 */
function updateGroupCallBanner(activeSession, chatId) {
  const banner = document.getElementById('groupCallBanner');
  if (!banner) return;
  if (!activeSession) {
    banner.classList.remove('show');
    return;
  }
  const text = document.getElementById('groupCallBannerText');
  if (text) text.textContent = `📞 グループ通話が行われています（${activeSession.participantCount || 0}人）`;
  banner.classList.add('show');
  const btn = document.getElementById('groupCallBannerJoinBtn');
  if (btn) {
    btn.onclick = () => {
      if (groupCallState.active) {
        showStatus('すでに通話中です', 'warn');
        return;
      }
      joinGroupCall(chatId, activeSession.sessionId);
    };
  }
}

/**
 * グループ通話の監視（チャット一覧表示中）
 */
function watchActiveGroupCalls() {
  Object.values(globalGroupCallListeners).forEach(unsub => {
    try { unsub(); } catch (e) {}
  });
  globalGroupCallListeners = {};

  Object.keys(chatsCache).forEach(chatId => {
    const chat = chatsCache[chatId];
    if (!chat || chat.type !== 'group') return;

    const sessionRef = ref(db, `groupCalls/${chatId}`);
    const unsub = onValue(sessionRef, (snap) => {
      if (!snap.exists()) {
        if (currentChatId === chatId) updateGroupCallBanner(null);
        return;
      }
      const data = snap.val();
      // アクティブなセッションを探す（participants が存在し、自分以外もいるもの）
      let activeSession = null;
      Object.entries(data).forEach(([sessionId, session]) => {
        if (!session || !session.participants) return;
        if (session.active === false) return;
        const pUids = Object.keys(session.participants);
        if (pUids.length === 0) return;
        activeSession = {
          sessionId,
          participantCount: pUids.length,
          ...session
        };
      });
      if (currentChatId === chatId) {
        updateGroupCallBanner(activeSession, chatId);
      }
    }, (err) => {
      console.warn('[groupCall] watch error:', err);
    });
    globalGroupCallListeners[chatId] = unsub;
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== ボタンハンドラ差し替え（グループ通話対応） =====
document.addEventListener('DOMContentLoaded', () => {
  // チャット通話ボタン
  const callBtn = document.getElementById('chatCallBtn');
  if (callBtn) {
    callBtn.addEventListener('click', async () => {
      if (!currentChatId) return;
      const chat = chatsCache[currentChatId];
      if (!chat) return;
      const memberCount = Object.keys(chat.members || {}).length;
      if (memberCount >= 3) {
        // グループ通話
        if (groupCallState.active) {
          if (confirm('通話中です。退出しますか？')) leaveGroupCall();
        } else {
          startGroupCall(currentChatId);
        }
      } else {
        // 1対1通話は既存の startCall を呼ぶ
        if (typeof window.startOneOnOneCall === 'function') {
          window.startOneOnOneCall();
        } else {
          showStatus('1対1通話機能が未実装です', 'warn');
        }
      }
    });
  }

  // 通話パネルの操作ボタン
  const micBtn = document.getElementById('cpMicBtn');
  if (micBtn) micBtn.addEventListener('click', toggleGroupCallMic);

  const endBtn = document.getElementById('cpEndBtn');
  if (endBtn) endBtn.addEventListener('click', async () => {
    if (groupCallState.active) {
      await leaveGroupCall();
    } else if (typeof window.endOneOnOneCall === 'function') {
      window.endOneOnOneCall();
    }
  });

  const minBtn = document.getElementById('cpMinimizeBtn');
  if (minBtn) minBtn.addEventListener('click', () => {
    const panel = document.getElementById('callPanel');
    if (panel) panel.classList.toggle('minimized');
  });

  // グループ通話バナーの参加ボタン（すでに updateGroupCallBanner 内で設定済み）
  // チャット切替時にバナーを消す
  const backBtn = document.getElementById('backToChatListBtn');
  if (backBtn) backBtn.addEventListener('click', () => {
    updateGroupCallBanner(null);
  });
});
