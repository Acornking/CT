<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messenger & Stories App (Firebase + HTML Complete)</title>
  <style>
    :root {
      --text-main: #111827;
      --text-sub: #4b5563;
      --accent: #06c755;
      --accent-dark: #05a847;
      --danger: #ef4444;
      --card-bg: rgba(255, 255, 255, 0.92);
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #bae6fd, #e0f2fe);
      background-size: cover;
      background-position: center;
      color: var(--text-main);
      transition: background 0.4s ease, filter 0.4s ease;
      position: relative;
      overflow-x: hidden;
    }

    /* 天候エフェクトレイヤー */
    #weather-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      transition: background 0.4s ease;
    }
    body.weather-sunny #weather-layer {
      background: radial-gradient(circle at 85% 15%, rgba(253, 224, 71, 0.35), transparent 45%);
    }
    body.weather-rain #weather-layer {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.32), rgba(15, 23, 42, 0.45));
    }
    body.weather-snow #weather-layer {
      background: linear-gradient(180deg, rgba(226, 232, 240, 0.35), rgba(148, 163, 184, 0.25));
    }
    body.weather-night #weather-layer {
      background: rgba(15, 23, 42, 0.52);
    }

    .rain-drop {
      position: fixed;
      top: -20px;
      width: 2px;
      height: 16px;
      background: rgba(186, 230, 253, 0.7);
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 2;
    }
    @keyframes fall {
      to { transform: translateY(105vh); }
    }

    .app-container {
      position: relative;
      z-index: 5;
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      min-height: 100vh;
    }

    @media (max-width: 820px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-wrap {
      position: relative;
      width: 48px;
      height: 48px;
    }

    .avatar-wrap img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    /* 未読メールがある時だけ表示する通知バッジ */
    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.5);
    }
    .badge.show {
      display: flex;
    }

    .fb-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      margin-bottom: 10px;
      display: inline-block;
    }
    .fb-status.connected {
      background: #dcfce7;
      color: #166534;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease, background 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-secondary { background: #e5e7eb; color: #1f2937; }
    .btn-secondary:hover { background: #d1d5db; }
    .btn-danger { background: var(--danger); color: #fff; }

    .settings-box {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .settings-box h3 {
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--text-sub);
    }
    .settings-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    select, input[type="text"], textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
      color: var(--text-main);
    }

    .stories-section {
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stories-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .story-thumb {
      flex: 0 0 76px;
      cursor: pointer;
      text-align: center;
    }
    .story-ring {
      width: 68px;
      height: 68px;
      margin: 0 auto 4px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, #f59e0b, #ec4899, #8b5cf6);
    }
    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
    }
    .story-thumb span {
      display: block;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mail-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .mail-item {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .mail-item.unread {
      border-left: 4px solid var(--danger);
      background: #fef2f2;
    }
    .mail-item .title { font-size: 13px; font-weight: 700; }
    .mail-item .snippet { font-size: 12px; color: var(--text-sub); }
    .tag-unread {
      font-size: 10px;
      background: var(--danger);
      color: #fff;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 32px);
      min-height: 540px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      background: rgba(249, 250, 251, 0.85);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }
    .msg.me {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.other {
      align-self: flex-start;
      background: #fff;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg audio {
      margin-top: 6px;
      max-width: 220px;
      height: 32px;
    }
    .chat-input-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .recording-status {
      font-size: 12px;
      color: var(--danger);
      font-weight: 700;
      margin-bottom: 6px;
      min-height: 18px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      max-height: 90vh;
      overflow-y: auto;
    }

    .story-viewer-img-wrap {
      width: 100%;
      height: 300px;
      border-radius: 12px;
      overflow: hidden;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-viewer-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* ストーリー画像の下に表示する貼り付け文字 */
    .story-caption-below {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      color: #111827;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      min-height: 48px;
      white-space: pre-wrap;
    }
    .story-audio-wrap {
      margin-top: 10px;
    }
    .story-audio-wrap audio {
      width: 100%;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
  </style>
</head>
<body class="weather-sunny">
  <div id="weather-layer"></div>

  <div class="app-container">
    <div class="panel">
      <div id="fb-status" class="fb-status">ローカルモード（Firebase設定でクラウド同期）</div>

      <div class="top-bar">
        <div class="user-profile">
          <div class="avatar-wrap">
            <img id="my-avatar" src="https://api.dicebear.com/7.x/thumbs/svg?seed=User" alt="マイアイコン" />
            <span id="unread-badge" class="badge" title="未読メール">0</span>
          </div>
          <div>
            <div style="font-weight: 700; font-size: 15px;">マイアカウント</div>
            <div id="unread-status-text" style="font-size: 12px; color: var(--text-sub);">未読メールはありません</div>
          </div>
        </div>
        <button id="btn-new-mail" class="btn btn-secondary">+ 新着メール</button>
      </div>

      <div class="settings-box">
        <h3>🌤 天候・背景のカスタマイズ</h3>
        <div class="settings-row">
          <select id="weather-select">
            <option value="sunny">☀️ 晴れ</option>
            <option value="rain">🌧 雨</option>
            <option value="snow">❄️ 雪</option>
            <option value="night">🌙 夜</option>
          </select>
        </div>
        <div class="settings-row">
          <select id="bg-preset-select">
            <option value="grad-blue">背景：スカイブルー</option>
            <option value="grad-sunset">背景：サンセット</option>
            <option value="grad-mint">背景：ミントグリーン</option>
            <option value="custom">背景：カスタム画像URL</option>
          </select>
        </div>
        <div id="custom-bg-row" style="display: none; gap: 6px;" class="settings-row">
          <input type="text" id="custom-bg-url" placeholder="https://example.com/bg.jpg" />
          <button id="btn-apply-custom-bg" class="btn btn-primary">適用</button>
        </div>
      </div>

      <div class="stories-section">
        <div class="section-title">
          <span>📸 ストーリー</span>
          <button id="btn-open-story-modal" class="btn btn-primary">+ 投稿</button>
        </div>
        <div id="stories-list" class="stories-list"></div>
      </div>

      <div>
        <div class="section-title">
          <span>✉️ 受信メール（クリックで既読）</span>
        </div>
        <div id="mail-list" class="mail-list"></div>
      </div>
    </div>

    <div class="panel chat-panel">
      <div class="top-bar" style="margin-bottom: 8px;">
        <div>
          <div style="font-weight: 700; font-size: 16px;">💬 トークルーム</div>
          <div style="font-size: 12px; color: var(--text-sub);">テキストと音声メッセージを送信できます</div>
        </div>
      </div>

      <div id="chat-messages" class="chat-messages"></div>

      <div id="recording-status" class="recording-status"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-text-input" placeholder="メッセージを入力..." />
        <button id="btn-send-text" class="btn btn-primary">送信</button>
        <button id="record-btn" class="btn btn-secondary">🎤 録音</button>
      </div>
    </div>
  </div>

  <!-- ストーリー投稿モーダル -->
  <div id="story-create-modal" class="modal-backdrop">
    <div class="modal-card">
      <h3 style="margin-bottom: 12px;">ストーリーを投稿</h3>

      <div class="form-group">
        <label>画像ファイルを選択（または下に画像URLを入力）</label>
        <input type="file" id="story-file-input" accept="image/*" />
      </div>

      <div class="form-group">
        <label>画像URL</label>
        <input type="text" id="story-url-input" placeholder="https://..." />
      </div>

      <div class="form-group">
        <label>貼り付ける文字（ストーリー画像の下に表示されます）</label>
        <textarea id="story-caption-input" rows="2" placeholder="今日のひとことやメモを入力..."></textarea>
      </div>

      <div class="form-group">
        <label>ストーリー音声（録音 または 音声ファイル）</label>
        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
          <button type="button" id="story-rec-btn" class="btn btn-secondary">🎙 音声録音</button>
          <span id="story-audio-label" style="font-size: 12px; color: var(--text-sub);">未設定</span>
        </div>
        <input type="file" id="story-audio-file" accept="audio/*" />
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px;">
        <button id="btn-cancel-story" class="btn btn-secondary">キャンセル</button>
        <button id="btn-publish-story" class="btn btn-primary">投稿する</button>
      </div>
    </div>
  </div>

  <!-- ストーリー閲覧モーダル -->
  <div id="story-view-modal" class="modal-backdrop">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <strong id="viewer-author">ユーザー</strong>
        <button id="btn-close-story-view" class="btn btn-secondary">閉じる</button>
      </div>

      <div class="story-viewer-img-wrap">
        <img id="viewer-image" src="" alt="ストーリー画像" />
      </div>

      <div id="viewer-caption-below" class="story-caption-below"></div>

      <div id="viewer-audio-wrap" class="story-audio-wrap" style="display: none;">
        <audio id="viewer-audio" controls></audio>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, updateDoc, doc,
      onSnapshot, query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      getStorage, ref, uploadBytes, getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    // =====================================================
    // Firebase設定（ご自身のプロジェクト設定に書き換えてください）
    // =====================================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const isFirebaseConfigured = !firebaseConfig.apiKey.startsWith("YOUR_");
    let db = null;
    let storage = null;

    if (isFirebaseConfigured) {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        storage = getStorage(app);
        const statusEl = document.getElementById("fb-status");
        statusEl.textContent = "Firebase 接続中（リアルタイム同期）";
        statusEl.classList.add("connected");
      } catch (e) {
        console.warn("Firebase初期化エラーのためローカルモードで動作します:", e);
      }
    }

    // =====================================================
    // アプリ状態
    // =====================================================
    const state = {
      mails: [
        { id: "init-1", title: "システムお知らせ", snippet: "アカウント設定が完了しました。", unread: false }
      ],
      stories: [
        {
          id: "story-1",
          author: "サクラ",
          avatar: "https://api.dicebear.com/7.x/thumbs/svg?seed=Sakura",
          image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop",
          caption: "海辺でお散歩中🌊 いい天気！",
          audioUrl: null
        }
      ],
      messages: [
        { id: "msg-1", sender: "other", text: "こんにちは！Firebase連携・ストーリー・音声送信に対応しました。" }
      ],
      draftImageFile: null,
      draftImagePreviewUrl: "",
      draftAudioBlob: null,
      draftAudioUrl: null
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // =====================================================
    // 1. 未読通知バッジ＆メール
    // =====================================================
    function renderMailsAndBadge() {
      const unreadCount = state.mails.filter(m => m.unread).length;
      const badge = document.getElementById("unread-badge");
      const statusText = document.getElementById("unread-status-text");

      if (unreadCount > 0) {
        badge.textContent = unreadCount > 99 ? "99+" : String(unreadCount);
        badge.classList.add("show");
        statusText.textContent = `未読メールが ${unreadCount} 件あります`;
      } else {
        badge.textContent = "0";
        badge.classList.remove("show");
        statusText.textContent = "未読メールはありません";
      }

      const mailList = document.getElementById("mail-list");
      mailList.innerHTML = "";
      state.mails.forEach(mail => {
        const div = document.createElement("div");
        div.className = `mail-item ${mail.unread ? "unread" : ""}`;
        div.addEventListener("click", () => markMailRead(mail.id));
        div.innerHTML = `
          <div>
            <div class="title">${escapeHtml(mail.title)}</div>
            <div class="snippet">${escapeHtml(mail.snippet)}</div>
          </div>
          ${mail.unread ? '<span class="tag-unread">未読</span>' : '<span style="font-size:11px;color:#6b7280;">既読</span>'}
        `;
        mailList.appendChild(div);
      });
    }

    async function markMailRead(id) {
      const target = state.mails.find(m => m.id === id);
      if (!target) return;
      target.unread = false;
      renderMailsAndBadge();

      if (db && !String(id).startsWith("init-")) {
        try {
          await updateDoc(doc(db, "mails", String(id)), { unread: false });
        } catch (e) {
          console.error(e);
        }
      }
    }

    async function simulateIncomingMail() {
      const samples = [
        { title: "新しいメッセージ通知", snippet: "グループに新しい投稿がありました。" },
        { title: "週末イベントのご案内", snippet: "今週末の予定をご確認ください。" },
        { title: "セキュリティレポート", snippet: "ログイン確認メールです。" }
      ];
      const pick = samples[Math.floor(Math.random() * samples.length)];
      const newMail = {
        title: pick.title,
        snippet: pick.snippet,
        unread: true,
        createdAt: Date.now()
      };

      if (db) {
        await addDoc(collection(db, "mails"), { ...newMail, serverTs: serverTimestamp() });
      } else {
        state.mails.unshift({ id: String(Date.now()), ...newMail });
        renderMailsAndBadge();
      }
    }

    document.getElementById("btn-new-mail").addEventListener("click", simulateIncomingMail);

    // =====================================================
    // 2. 天候・背景変更
    // =====================================================
    let rainInterval = null;

    function applyWeather(weather) {
      document.body.classList.remove("weather-sunny", "weather-rain", "weather-snow", "weather-night");
      document.body.classList.add(`weather-${weather}`);

      if (rainInterval) {
        clearInterval(rainInterval);
        rainInterval = null;
      }
      document.querySelectorAll(".rain-drop").forEach(el => el.remove());

      if (weather === "rain") {
        rainInterval = setInterval(() => {
          const drop = document.createElement("div");
          drop.className = "rain-drop";
          drop.style.left = `${Math.random() * 100}vw`;
          drop.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
          document.body.appendChild(drop);
          setTimeout(() => drop.remove(), 1100);
        }, 90);
      }
    }

    function applyBgPreset(preset) {
      const customRow = document.getElementById("custom-bg-row");
      if (preset === "custom") {
        customRow.style.display = "flex";
        return;
      }
      customRow.style.display = "none";
      document.body.style.backgroundImage = "none";

      if (preset === "grad-blue") {
        document.body.style.background = "linear-gradient(135deg, #bae6fd, #e0f2fe)";
      } else if (preset === "grad-sunset") {
        document.body.style.background = "linear-gradient(135deg, #fed7aa, #fbcfe8)";
      } else if (preset === "grad-mint") {
        document.body.style.background = "linear-gradient(135deg, #bbf7d0, #ccfbf1)";
      }
      applyWeather(document.getElementById("weather-select").value);
    }

    function applyCustomBg() {
      const url = document.getElementById("custom-bg-url").value.trim();
      if (!url) {
        alert("背景画像のURLを入力してください。");
        return;
      }
      document.body.style.background = "#111827";
      document.body.style.backgroundImage = `url("${url}")`;
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      applyWeather(document.getElementById("weather-select").value);
    }

    document.getElementById("weather-select").addEventListener("change", e => applyWeather(e.target.value));
    document.getElementById("bg-preset-select").addEventListener("change", e => applyBgPreset(e.target.value));
    document.getElementById("btn-apply-custom-bg").addEventListener("click", applyCustomBg);

    // =====================================================
    // 3. ストーリー（画像・下部貼り付け文字・音声）
    // =====================================================
    let storyRecorder = null;
    let storyAudioChunks = [];

    function renderStories() {
      const list = document.getElementById("stories-list");
      list.innerHTML = "";
      state.stories.forEach(story => {
        const item = document.createElement("div");
        item.className = "story-thumb";
        item.addEventListener("click", () => openStoryView(story.id));
        item.innerHTML = `
          <div class="story-ring">
            <img src="${story.image}" alt="${escapeHtml(story.author)}" onerror="this.src='https://placehold.co/200x200?text=No+Image'" />
          </div>
          <span>${escapeHtml(story.author)}</span>
        `;
        list.appendChild(item);
      });
    }

    function openStoryCreateModal() {
      state.draftImageFile = null;
      state.draftImagePreviewUrl = "";
      state.draftAudioBlob = null;
      state.draftAudioUrl = null;
      document.getElementById("story-file-input").value = "";
      document.getElementById("story-url-input").value = "";
      document.getElementById("story-caption-input").value = "";
      document.getElementById("story-audio-file").value = "";
      document.getElementById("story-audio-label").textContent = "未設定";
      document.getElementById("story-create-modal").classList.add("open");
    }

    function closeStoryCreateModal() {
      document.getElementById("story-create-modal").classList.remove("open");
    }

    document.getElementById("btn-open-story-modal").addEventListener("click", openStoryCreateModal);
    document.getElementById("btn-cancel-story").addEventListener("click", closeStoryCreateModal);

    document.getElementById("story-file-input").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      state.draftImageFile = file;
      state.draftImagePreviewUrl = URL.createObjectURL(file);
      document.getElementById("story-url-input").value = "";
    });

    document.getElementById("story-url-input").addEventListener("input", e => {
      if (e.target.value.trim()) {
        state.draftImageFile = null;
        state.draftImagePreviewUrl = e.target.value.trim();
      }
    });

    document.getElementById("story-audio-file").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      state.draftAudioBlob = file;
      state.draftAudioUrl = URL.createObjectURL(file);
      document.getElementById("story-audio-label").textContent = `選択済み: ${file.name}`;
    });

    document.getElementById("story-rec-btn").addEventListener("click", async () => {
      const btn = document.getElementById("story-rec-btn");
      const label = document.getElementById("story-audio-label");

      if (!storyRecorder || storyRecorder.state === "inactive") {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          storyAudioChunks = [];
          storyRecorder = new MediaRecorder(stream);
          storyRecorder.ondataavailable = e => {
            if (e.data.size > 0) storyAudioChunks.push(e.data);
          };
          storyRecorder.onstop = () => {
            const blob = new Blob(storyAudioChunks, { type: "audio/webm" });
            state.draftAudioBlob = blob;
            state.draftAudioUrl = URL.createObjectURL(blob);
            label.textContent = "録音音声を設定しました";
            stream.getTracks().forEach(t => t.stop());
          };
          storyRecorder.start();
          btn.textContent = "⏹ 録音停止";
          btn.classList.add("btn-danger");
        } catch (err) {
          alert("マイクにアクセスできませんでした。音声ファイルを選択してください。");
        }
      } else {
        storyRecorder.stop();
        btn.textContent = "🎙 音声録音";
        btn.classList.remove("btn-danger");
      }
    });

    async function uploadToStorageIfPossible(blobOrFile, folder, fallbackUrl) {
      if (!storage || !blobOrFile) return fallbackUrl || null;
      try {
        const ext = blobOrFile.name ? blobOrFile.name.split(".").pop() : "webm";
        const fileRef = ref(storage, `${folder}/${Date.now()}.${ext}`);
        await uploadBytes(fileRef, blobOrFile);
        return await getDownloadURL(fileRef);
      } catch (e) {
        console.warn("Storageアップロード失敗、ローカルURLを使用:", e);
        return fallbackUrl || null;
      }
    }

    document.getElementById("btn-publish-story").addEventListener("click", async () => {
      const urlInput = document.getElementById("story-url-input").value.trim();
      const previewImage = state.draftImagePreviewUrl || urlInput;
      if (!previewImage) {
        alert("ストーリーの画像を選択するか、画像URLを入力してください。");
        return;
      }

      const caption = document.getElementById("story-caption-input").value.trim() || "（貼り付け文字なし）";
      const finalImageUrl = await uploadToStorageIfPossible(state.draftImageFile, "stories/images", previewImage);
      const finalAudioUrl = await uploadToStorageIfPossible(state.draftAudioBlob, "stories/audio", state.draftAudioUrl);

      const storyData = {
        author: "あなた",
        avatar: document.getElementById("my-avatar").src,
        image: finalImageUrl,
        caption,
        audioUrl: finalAudioUrl,
        createdAt: Date.now()
      };

      if (db) {
        await addDoc(collection(db, "stories"), { ...storyData, serverTs: serverTimestamp() });
      } else {
        state.stories.unshift({ id: String(Date.now()), ...storyData });
        renderStories();
      }

      closeStoryCreateModal();
    });

    function openStoryView(id) {
      const story = state.stories.find(s => s.id === id);
      if (!story) return;

      document.getElementById("viewer-author").textContent = `${story.author} のストーリー`;
      document.getElementById("viewer-image").src = story.image;
      document.getElementById("viewer-caption-below").textContent = story.caption || "";

      const audioWrap = document.getElementById("viewer-audio-wrap");
      const audioEl = document.getElementById("viewer-audio");
      if (story.audioUrl) {
        audioWrap.style.display = "block";
        audioEl.src = story.audioUrl;
        audioEl.play().catch(() => {});
      } else {
        audioWrap.style.display = "none";
        audioEl.pause();
        audioEl.removeAttribute("src");
      }

      document.getElementById("story-view-modal").classList.add("open");
    }

    document.getElementById("btn-close-story-view").addEventListener("click", () => {
      document.getElementById("viewer-audio").pause();
      document.getElementById("story-view-modal").classList.remove("open");
    });

    // =====================================================
    // 4. チャット＆音声送信
    // =====================================================
    let chatRecorder = null;
    let chatAudioChunks = [];

    function renderMessages() {
      const box = document.getElementById("chat-messages");
      box.innerHTML = "";
      state.messages.forEach(m => {
        const div = document.createElement("div");
        div.className = `msg ${m.sender}`;
        if (m.text) {
          const p = document.createElement("div");
          p.textContent = m.text;
          div.appendChild(p);
        }
        if (m.audioUrl) {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = m.audioUrl;
          div.appendChild(audio);
        }
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendTextMessage() {
      const input = document.getElementById("chat-text-input");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      const msg = { sender: "me", text, createdAt: Date.now() };
      if (db) {
        await addDoc(collection(db, "messages"), { ...msg, serverTs: serverTimestamp() });
      } else {
        state.messages.push({ id: String(Date.now()), ...msg });
        renderMessages();
      }
    }

    document.getElementById("btn-send-text").addEventListener("click", sendTextMessage);
    document.getElementById("chat-text-input").addEventListener("keydown", e => {
      if (e.key === "Enter") sendTextMessage();
    });

    document.getElementById("record-btn").addEventListener("click", async () => {
      const btn = document.getElementById("record-btn");
      const status = document.getElementById("recording-status");

      if (!chatRecorder || chatRecorder.state === "inactive") {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          chatAudioChunks = [];
          chatRecorder = new MediaRecorder(stream);
          chatRecorder.ondataavailable = e => {
            if (e.data.size > 0) chatAudioChunks.push(e.data);
          };
          chatRecorder.onstop = async () => {
            const blob = new Blob(chatAudioChunks, { type: "audio/webm" });
            const localUrl = URL.createObjectURL(blob);
            const audioUrl = await uploadToStorageIfPossible(blob, "chat/audio", localUrl);

            const msg = {
              sender: "me",
              text: "🎤 音声メッセージ",
              audioUrl,
              createdAt: Date.now()
            };

            if (db) {
              await addDoc(collection(db, "messages"), { ...msg, serverTs: serverTimestamp() });
            } else {
              state.messages.push({ id: String(Date.now()), ...msg });
              renderMessages();
            }

            status.textContent = "";
            stream.getTracks().forEach(t => t.stop());
          };
          chatRecorder.start();
          btn.textContent = "⏹ 送信";
          btn.classList.remove("btn-secondary");
          btn.classList.add("btn-danger");
          status.textContent = "録音中... もう一度押すと送信します";
        } catch (err) {
          alert("マイクの使用が許可されていないか、非対応環境です。");
        }
      } else {
        chatRecorder.stop();
        btn.textContent = "🎤 録音";
        btn.classList.remove("btn-danger");
        btn.classList.add("btn-secondary");
      }
    });

    // =====================================================
    // 5. Firestore リアルタイム購読
    // =====================================================
    function subscribeFirestore() {
      if (!db) return;

      onSnapshot(query(collection(db, "mails"), orderBy("createdAt", "desc")), snap => {
        state.mails = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMailsAndBadge();
      });

      onSnapshot(query(collection(db, "stories"), orderBy("createdAt", "desc")), snap => {
        state.stories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderStories();
      });

      onSnapshot(query(collection(db, "messages"), orderBy("createdAt", "asc")), snap => {
        state.messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMessages();
      });
    }

    // 初期描画
    applyBgPreset("grad-blue");
    renderMailsAndBadge();
    renderStories();
    renderMessages();
    subscribeFirestore();
  </script>
</body>
</html>
