<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>69Chat</title>
  <!-- 初期ファビコン（未読なし状態） -->
  <link id="dynamic-favicon" rel="icon" type="image/png" href="" />

  <!-- Firebase SDK (Compat版で単一HTMLでも扱いやすく構成) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 58px;
      padding: 0 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .icon-preview-wrap {
      position: relative;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-preview-wrap img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
    }

    .badge-pill {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.45);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .badge-pill.zero {
      background: rgba(148, 163, 184, 0.14);
      color: var(--muted);
      border-color: var(--border);
    }

    button {
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: rgba(148, 163, 184, 0.16);
      color: var(--text);
    }

    button.danger {
      background: var(--danger);
      color: #fff;
    }

    button:hover {
      opacity: 0.92;
    }

    .auth-box {
      max-width: 420px;
      margin: 60px auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-box h2 {
      margin: 0 0 4px;
      font-size: 1.2rem;
    }

    input, textarea {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    .app-main {
      flex: 1;
      display: none;
      grid-template-columns: 280px 1fr;
      min-height: 0;
    }

    .app-main.active {
      display: grid;
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .room-item {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .room-item.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }

    .room-unread {
      background: var(--danger);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .chat-area {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.55);
    }

    .messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .msg.mine {
      align-self: flex-end;
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .msg-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .composer {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      gap: 10px;
    }

    .demo-bar {
      padding: 8px 18px;
      background: rgba(15, 23, 42, 0.75);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="icon-preview-wrap" title="現在のサイトアイコン状態">
        <img id="header-icon-preview" alt="サイトアイコン" />
      </div>
      <span>69Chat</span>
    </div>
    <div class="header-actions">
      <span id="unread-status-pill" class="badge-pill zero">未読: 0</span>
      <span id="user-label" style="color: var(--muted);"></span>
      <button id="logout-btn" class="secondary" style="display:none;">ログアウト</button>
    </div>
  </header>

  <!-- バッジ動作確認用バー（Firebase未設定時でもアイコン変化を即テスト可能） -->
  <div class="demo-bar">
    <span>アイコン通知テスト:</span>
    <button id="test-add-unread" class="secondary">未読を +1</button>
    <button id="test-clear-unread" class="secondary">未読を 0 にする</button>
    <span id="fb-mode-label">Firebase設定待ち（ローカル動作中）</span>
  </div>

  <!-- ログイン画面 -->
  <section id="auth-section" class="auth-box">
    <h2>ログイン / 登録</h2>
    <input id="email-input" type="email" placeholder="メールアドレス" />
    <input id="password-input" type="password" placeholder="パスワード（6文字以上）" />
    <input id="nickname-input" type="text" placeholder="ニックネーム（新規登録・初回プロフィール用）" />
    <div style="display:flex; gap:10px;">
      <button id="login-btn" style="flex:1;">ログイン</button>
      <button id="signup-btn" class="secondary" style="flex:1;">新規登録</button>
    </div>
    <div id="auth-error" style="color:#fca5a5; font-size:0.85rem;"></div>
  </section>

  <!-- チャット本体 -->
  <main id="app-main" class="app-main">
    <aside>
      <div style="display:flex; gap:6px;">
        <input id="new-room-name" type="text" placeholder="新しいルーム名" />
        <button id="create-room-btn">作成</button>
      </div>
      <div id="room-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </aside>

    <section class="chat-area">
      <div class="chat-header">
        <strong id="current-room-title">ルームを選択してください</strong>
        <button id="mark-read-btn" class="secondary">既読にする</button>
      </div>
      <div id="messages-list" class="messages"></div>
      <form id="message-form" class="composer">
        <input id="message-input" type="text" placeholder="メッセージを入力..." autocomplete="off" />
        <button type="submit">送信</button>
      </form>
    </section>
  </main>

  <script>
    // =========================================================================
    // 1. Firebase 設定（ご自身のプロジェクト値に書き換えてください）
    // =========================================================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const isFirebaseConfigured = !firebaseConfig.apiKey.startsWith("YOUR_");
    let auth = null;
    let db = null;

    if (isFirebaseConfigured) {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.database();
      document.getElementById("fb-mode-label").textContent = "Firebase Realtime Database 接続有効";
    }

    // =========================================================================
    // 2. サイトアイコン（ファビコン）の動的生成＆通知マーク制御
    // =========================================================================
    const faviconEl = document.getElementById("dynamic-favicon");
    const headerIconPreview = document.getElementById("header-icon-preview");
    const unreadStatusPill = document.getElementById("unread-status-pill");
    const BASE_TITLE = "69Chat";

    // ベースとなる通知マークなしのアイコン画像をCanvasで作成
    function createBaseIconDataUrl(size = 64) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      // 背景グラデーション
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, "#0284c7");
      grad.addColorStop(1, "#38bdf8");
      ctx.fillStyle = grad;

      // 角丸背景
      const r = size * 0.22;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, r);
      ctx.fill();

      // チャット吹き出しモチーフ（通知マークなし）
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.roundRect(size * 0.18, size * 0.24, size * 0.64, size * 0.44, size * 0.12);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(size * 0.30, size * 0.68);
      ctx.lineTo(size * 0.24, size * 0.80);
      ctx.lineTo(size * 0.42, size * 0.68);
      ctx.closePath();
      ctx.fill();

      return canvas.toDataURL("image/png");
    }

    const cleanIconDataUrl = createBaseIconDataUrl(64);
    const cleanIconImg = new Image();
    cleanIconImg.src = cleanIconDataUrl;

    // 未読数に応じてアイコンを更新（0件なら通知マークなし、1件以上なら通知マークあり）
    function setSiteNotificationIcon(unreadCount) {
      const count = Math.max(0, Number(unreadCount) || 0);

      // タイトルとステータス表示を更新
      document.title = count > 0 ? `(${count}) ${BASE_TITLE}` : BASE_TITLE;
      unreadStatusPill.textContent = `未読: ${count}`;
      unreadStatusPill.classList.toggle("zero", count === 0);

      // 未読が0のときは通知マークなしの元アイコンをそのまま使用
      if (count === 0) {
        faviconEl.href = cleanIconDataUrl;
        headerIconPreview.src = cleanIconDataUrl;
        return;
      }

      // 未読があるときだけ右上に通知マークを描画
      const size = 64;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      const drawBadge = () => {
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(cleanIconImg, 0, 0, size, size);

        const label = count > 99 ? "99+" : String(count);
        const radius = label.length >= 3 ? size * 0.23 : size * 0.20;
        const cx = size - radius - 2;
        const cy = radius + 2;

        // バッジ外枠（視認性向上）
        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(cx, cy, radius + 2.5, 0, Math.PI * 2);
        ctx.fill();

        // 赤い通知マーク
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();

        // 未読数字
        ctx.fillStyle = "#ffffff";
        ctx.font = `bold ${label.length >= 3 ? Math.round(size * 0.20) : Math.round(size * 0.24)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, cx, cy + 0.5);

        const badgedUrl = canvas.toDataURL("image/png");
        faviconEl.href = badgedUrl;
        headerIconPreview.src = badgedUrl;
      };

      if (cleanIconImg.complete) {
        drawBadge();
      } else {
        cleanIconImg.onload = drawBadge;
      }
    }

    // 初期状態は未読0（通知マークなし）
    setSiteNotificationIcon(0);

    // テスト用ボタン
    let demoUnread = 0;
    document.getElementById("test-add-unread").addEventListener("click", () => {
      demoUnread += 1;
      setSiteNotificationIcon(demoUnread);
    });
    document.getElementById("test-clear-unread").addEventListener("click", () => {
      demoUnread = 0;
      setSiteNotificationIcon(0);
    });

    // =========================================================================
    // 3. チャット＆未読集計ロジック（Firebase RTDB）
    // =========================================================================
    let currentUser = null;
    let currentProfile = null;
    let currentRoomId = null;
    let roomUnreadMap = {}; // { [chatId]: number }
    let roomReadsMap = {};  // { [chatId]: lastReadTimestamp }
    let messageListeners = {};

    function recomputeTotalUnread() {
      const total = Object.values(roomUnreadMap).reduce((sum, n) => sum + (n || 0), 0);
      setSiteNotificationIcon(total);
    }

    function renderRoomList(rooms) {
      const listEl = document.getElementById("room-list");
      listEl.innerHTML = "";
      rooms.forEach((room) => {
        const div = document.createElement("div");
        div.className = "room-item" + (room.id === currentRoomId ? " active" : "");

        const nameSpan = document.createElement("span");
        nameSpan.textContent = room.name || room.id;

        const unread = roomUnreadMap[room.id] || 0;
        div.appendChild(nameSpan);

        if (unread > 0) {
          const badge = document.createElement("span");
          badge.className = "room-unread";
          badge.textContent = unread > 99 ? "99+" : String(unread);
          div.appendChild(badge);
        }

        div.addEventListener("click", () => selectRoom(room.id, room.name || room.id));
        listEl.appendChild(div);
      });
    }

    async function markRoomAsRead(chatId) {
      if (!currentUser || !chatId || !db) return;
      const now = Date.now();
      roomReadsMap[chatId] = now;
      roomUnreadMap[chatId] = 0;
      recomputeTotalUnread();
      await db.ref(`chatReads/${chatId}/${currentUser.uid}`).set(now);
    }

    function watchRoomUnread(chatId) {
      if (!currentUser || !db || messageListeners[chatId]) return;

      const ref = db.ref(`chatMessages/${chatId}`);
      const handler = (snap) => {
        const lastRead = roomReadsMap[chatId] || 0;
        let count = 0;
        snap.forEach((child) => {
          const msg = child.val();
          if (!msg) return;
          const isOther = msg.authorUid && msg.authorUid !== currentUser.uid;
          const isNewer = (msg.createdAt || 0) > lastRead;
          if (isOther && isNewer) {
            // 閲覧中のルームかつタブがアクティブなら即既読扱い
            if (chatId === currentRoomId && document.visibilityState === "visible") {
              markRoomAsRead(chatId);
              count = 0;
            } else {
              count += 1;
            }
          }
        });
        roomUnreadMap[chatId] = count;
        recomputeTotalUnread();
      };

      ref.on("value", handler);
      messageListeners[chatId] = { ref, handler };
    }

    function selectRoom(chatId, roomName) {
      currentRoomId = chatId;
      document.getElementById("current-room-title").textContent = roomName;
      markRoomAsRead(chatId);

      // メッセージ表示購読
      const msgList = document.getElementById("messages-list");
      msgList.innerHTML = "";
      if (!db) return;

      db.ref(`chatMessages/${chatId}`).limitToLast(100).on("value", (snap) => {
        if (currentRoomId !== chatId) return;
        msgList.innerHTML = "";
        snap.forEach((child) => {
          const m = child.val();
          if (!m) return;
          const div = document.createElement("div");
          div.className = "msg" + (m.authorUid === currentUser.uid ? " mine" : "");

          const meta = document.createElement("div");
          meta.className = "msg-meta";
          const timeStr = m.createdAt ? new Date(m.createdAt).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) : "";
          meta.textContent = `${m.authorName || "ユーザー"} ・ ${timeStr}`;

          const body = document.createElement("div");
          body.textContent = m.content || "";

          div.appendChild(meta);
          div.appendChild(body);
          msgList.appendChild(div);
        });
        msgList.scrollTop = msgList.scrollHeight;
        if (document.visibilityState === "visible") {
          markRoomAsRead(chatId);
        }
      });
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && currentRoomId) {
        markRoomAsRead(currentRoomId);
      }
    });

    document.getElementById("mark-read-btn").addEventListener("click", () => {
      if (currentRoomId) markRoomAsRead(currentRoomId);
    });

    document.getElementById("message-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (!text || !currentUser || !currentRoomId || !db) return;

      const now = Date.now();
      await db.ref(`chatMessages/${currentRoomId}`).push({
        content: text,
        authorUid: currentUser.uid,
        authorName: currentProfile?.nickname || currentUser.email || "ユーザー",
        authorAvatar: currentProfile?.avatar || cleanIconDataUrl,
        createdAt: now
      });
      await markRoomAsRead(currentRoomId);
      input.value = "";
    });

    document.getElementById("create-room-btn").addEventListener("click", async () => {
      const nameInput = document.getElementById("new-room-name");
      const roomName = nameInput.value.trim();
      if (!roomName || !currentUser || !db) return;

      const now = Date.now();
      const roomRef = db.ref("chatMeta").push();
      const chatId = roomRef.key;
      const roomData = {
        name: roomName,
        type: "group",
        createdAt: now,
        createdBy: currentUser.uid,
        members: { [currentUser.uid]: true }
      };
      await roomRef.set(roomData);
      await db.ref(`userChats/${currentUser.uid}/${chatId}`).set(roomData);
      nameInput.value = "";
      selectRoom(chatId, roomName);
    });

    // 認証処理
    document.getElementById("login-btn").addEventListener("click", async () => {
      if (!isFirebaseConfigured) {
        document.getElementById("auth-error").textContent = "firebaseConfig を設定してください。上のテストボタンでアイコン通知は確認できます。";
        return;
      }
      const email = document.getElementById("email-input").value.trim();
      const pass = document.getElementById("password-input").value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        document.getElementById("auth-error").textContent = err.message;
      }
    });

    document.getElementById("signup-btn").addEventListener("click", async () => {
      if (!isFirebaseConfigured) {
        document.getElementById("auth-error").textContent = "firebaseConfig を設定してください。";
        return;
      }
      const email = document.getElementById("email-input").value.trim();
      const pass = document.getElementById("password-input").value;
      const nick = document.getElementById("nickname-input").value.trim() || email.split("@")[0];
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.ref(`chatProfiles/${cred.user.uid}`).set({
          nickname: nick,
          avatar: cleanIconDataUrl,
          email,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
      } catch (err) {
        document.getElementById("auth-error").textContent = err.message;
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      if (auth) auth.signOut();
    });

    if (isFirebaseConfigured) {
      auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        const authSection = document.getElementById("auth-section");
        const appMain = document.getElementById("app-main");
        const logoutBtn = document.getElementById("logout-btn");
        const userLabel = document.getElementById("user-label");

        if (!user) {
          authSection.style.display = "flex";
          appMain.classList.remove("active");
          logoutBtn.style.display = "none";
          userLabel.textContent = "";
          setSiteNotificationIcon(0);
          return;
        }

        authSection.style.display = "none";
        appMain.classList.add("active");
        logoutBtn.style.display = "inline-block";

        const profSnap = await db.ref(`chatProfiles/${user.uid}`).get();
        currentProfile = profSnap.val() || {
          nickname: user.email.split("@")[0],
          avatar: cleanIconDataUrl
        };
        userLabel.textContent = currentProfile.nickname;

        // 自分の既読タイムスタンプ購読
        db.ref("chatReads").on("value", (snap) => {
          roomReadsMap = {};
          snap.forEach((roomSnap) => {
            const val = roomSnap.child(user.uid).val();
            if (typeof val === "number") {
              roomReadsMap[roomSnap.key] = val;
            }
          });
          Object.keys(roomUnreadMap).forEach((cid) => {
            if (messageListeners[cid]) {
              messageListeners[cid].ref.once("value", messageListeners[cid].handler);
            }
          });
        });

        // 所属ルーム購読
        db.ref(`userChats/${user.uid}`).on("value", (snap) => {
          const rooms = [];
          snap.forEach((child) => {
            rooms.push({ id: child.key, ...(child.val() || {}) });
            watchRoomUnread(child.key);
          });
          renderRoomList(rooms);
          if (!currentRoomId && rooms.length > 0) {
            selectRoom(rooms[0].id, rooms[0].name || rooms[0].id);
          }
        });
      });
    }
  </script>
</body>
</html>
